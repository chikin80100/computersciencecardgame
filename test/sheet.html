<!DOCTYPE html><html><head><meta charset="utf-8"><title>絵柄の一覧</title><style>
body{margin:0;background:#0e3a2b;font:11px sans-serif;color:#eee}
.g{display:grid;grid-template-columns:repeat(var(--cols),calc(var(--px) + 24px));gap:6px;padding:8px}
.c{background:#efe2bf;color:#2a2216;padding:4px;text-align:center}
.a{height:var(--px);display:grid;place-items:center;position:relative}
.a img{width:var(--px);height:var(--px);image-rendering:pixelated;position:relative}
.a::before{content:'';position:absolute;inset:0;background:var(--c);opacity:.2}
.s{display:flex;gap:4px;justify-content:center;margin-top:2px}.s img{width:36px;image-rendering:pixelated}
.id{color:#7a6a4a;font-size:10px}
</style></head><body><div class="g" id="g"></div>
<!-- 絵柄（src/art.js）を一覧で見るためのページ。test/sheet.py から開く。
     ?set=father … シリーズで絞る / ?ids=enigma,alan … カードを指定 / ?big=1 … 大きく表示 -->
<script src="../src/data.js"></script><script src="../src/art.js"></script>
<script>
injectArtCSS();
const q = new URLSearchParams(location.search);
const all = {}; MONSTERS.forEach(d => { all[d.id] = d; }); TRAINERS.forEach(d => { all[d.id] = d; });
let ids = MONSTERS.map(d => d.id).concat(TRAINERS.map(d => d.id));
if (q.get('set')) ids = ids.filter(id => (all[id].set || 'base') === q.get('set'));
if (q.get('ids')) ids = q.get('ids').split(',').map(s => s.trim()).filter(id => all[id]);
const big = q.get('big') === '1';
document.body.style.setProperty('--px', big ? '144px' : '96px');
document.body.style.setProperty('--cols', big ? 6 : 8);
const KC = { item: '#4f6b7a', sup: '#9a4f2c', tool: '#2f7a72' };
document.getElementById('g').innerHTML = ids.map(id => {
  const d = all[id]; const c = d.kind ? KC[d.kind] : TYPES[d.type].c;
  return `<div class="c"><div class="a ${tileClass(d.kind ? d : { kind: 'mon', type: d.type })}" style="--c:${c}"><img src="${spriteURL(id)}"></div><div>${d.name}</div><div class="id">${id}</div><div class="s"><img src="${spriteURL(id)}"><img src="${spriteURL(id, 'sil')}"></div></div>`;
}).join('');
</script></body></html>
