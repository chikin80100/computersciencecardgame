<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS用語カードバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=M+PLUS+1+Code:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/*STYLE*/
</style>
</head>
<body data-screen="title">
<canvas id="pcb" aria-hidden="true"></canvas>
<div id="app">
  <section id="scr-title" class="screen"></section>
  <section id="scr-select" class="screen" hidden></section>
  <section id="scr-packs" class="screen" hidden></section>
  <section id="scr-decks" class="screen" hidden></section>
  <section id="scr-editor" class="screen" hidden></section>
  <section id="scr-dex" class="screen" hidden></section>
  <section id="scr-rules" class="screen" hidden></section>
  <section id="scr-battle" class="screen" hidden aria-label="対戦">
    <div id="board"></div>
    <div id="hand" aria-label="手札"></div>
    <div id="actbar"></div>
  </section>
</div>
<div id="sheet" class="overlay" hidden></div>
<div id="choice" class="overlay center" hidden></div>
<div id="menu" class="overlay center" hidden></div>
<div id="result" class="overlay center" hidden></div>
<div id="coin" class="overlay center coin-ov" hidden></div>
<div id="banner" hidden></div>
<div id="say" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="logpanel" hidden></div>
<div id="handover" class="handover" hidden></div>
<div id="packov" role="dialog" aria-modal="true" aria-label="パック開封" hidden></div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
